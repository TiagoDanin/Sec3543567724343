name: CI

# Verificação em pull request. O par que substitui suíte de teste neste projeto
# é typecheck + build, conforme o CLAUDE.md. Push na main não entra aqui: o
# deploy.yml já roda as mesmas verificações antes de publicar.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Formatação
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
